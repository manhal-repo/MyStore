name: Build MyStore

on:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup JDK 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '20'

      - name: Build Web Store
        working-directory: myrepo-store
        run: |
          npm install
          npm run build

      - name: Build Android APK
        working-directory: mystore-android
        run: |
          gradle assembleRelease

      - name: Upload Android APK
        uses: actions/upload-artifact@v4
        with:
          name: MyStore-APK
          path: mystore-android/app/build/outputs/apk/release/*.apk

      - name: Upload Web Store
        uses: actions/upload-artifact@v4
        with:
          name: MyStore-Web
          path: myrepo-store/dist/
